<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unDraw - Open source illustrations for any idea </title>
    <link rel="stylesheet" href="./style.css" >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>


<body>
<!-- Header-->
    <header>
        <div class="logo">
            <img src="./asset/undraw logo.jpg" alt="unDraw">
        </div>
        
        <div class="middle">
            <div class="supporters">
                <p> ❤️ Supporters</p>
            </div>

            <div class="more">
                <p class="mmm"> More </p>
                <img class="arrowdown" src="./asset/down-arrow (2).png">
            </div>
        </div>

        <div class="crown">
            <p> Illustrations </p>
            <img src="./asset/crown (1).png">
        </div>
    </header>

    <section>
        <div class="herosection">
            <h1> <span class="highlight1"> Open-source illustrations </span> for any idea you can imagine and create. </h1>
            <button> Browse now </button>
            <p> Created by <span class="highlight2"> Katerina Limpitsouni </span> </p>
        </div>

        <div class="illustrations">
            <div class="group1">
                <img class="illus_1" src="./asset/undraw_flying-drone_0oms.svg">
                <img class="illus_2" src="./asset/undraw_walking-in-rain_tw0k.svg">
                <!-- <img class="illus_6" src="./asset/undraw_drone-surveillance_mc4g.svg"> -->
            </div>

            <img class="illus_3" src="./asset/undraw_athletes-training_koqa.svg">
            
            <div class="group2">
                <img class="illus_4" src="./asset/undraw_fun-moments_x0p9.svg">
                <img class="illus_5" src="./asset/undraw_applications_h0mq.svg">
            </div>
        </div>




    </section>
    















    
</body>
</html>
